name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Vulnerabilites hautes ou critiques des dependances de production : echec.
      - run: pnpm audit --prod --audit-level high

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Les migrations derivees de TypeScript (enums, donnees par defaut) doivent etre a jour.
      - run: pnpm db:generate && git diff --exit-code supabase/migrations supabase/functions/_shared

      - run: pnpm db:start

      - run: pnpm db:lint

      # Tests pgTAP : schema, isolation entre communes (RLS), stockage.
      - run: pnpm db:test

      # Le seed de demonstration doit passer sur une base vierge.
      - run: pnpm db:seed

      # Meme suite de contrat que le mock, sur Supabase (apres le seed).
      - run: SUPABASE_CONTRACT=1 pnpm --filter @app/data exec vitest run --no-file-parallelism src/supabase

  # Secrets : historique complet analyse par gitleaks (exception documentee dans .gitleaks.toml).
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # Parcours E2E du dashboard (donnees de demonstration) dont axe sur toutes les routes pour 3 profils :
  # une violation « serious » ou « critical » fait echouer la CI.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter dashboard exec playwright install --with-deps chromium

      - run: pnpm --filter dashboard test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/dashboard/test-results
          retention-days: 7

  # Image autonome du dashboard (deploiement hors Vercel) : construction seulement.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/dashboard/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
