name: Test de restauration

# Chaque mois (et a la demande) : derniere sauvegarde de la base telechargee depuis Scaleway, dechiffree
# (cle privee age dans l'environnement protege `restore`), restauree dans un Supabase ephemere dont le
# schema vient des migrations du depot, puis controlee (communes, actualites, signalements, RLS).
# Environnement `restore` : AGE_IDENTITY, SCW_ACCESS_KEY, SCW_SECRET_KEY (lecture), SCW_BUCKET.

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    environment: restore
    timeout-minutes: 45
    env:
      SCW_ENDPOINT: https://s3.fr-par.scw.cloud
      AWS_DEFAULT_REGION: fr-par
      AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Client PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -q && sudo apt-get install -y -q postgresql-client-17
      - name: Derniere sauvegarde
        run: |
          latest=$(aws s3 ls "s3://${{ secrets.SCW_BUCKET }}/db/" --endpoint-url "$SCW_ENDPOINT" | sort | tail -n 1 | awk '{print $4}')
          test -n "$latest" || { echo "Aucune sauvegarde trouvee"; exit 1; }
          echo "LATEST=$latest" >> "$GITHUB_ENV"
          aws s3 cp "s3://${{ secrets.SCW_BUCKET }}/db/$latest" /tmp/db.dump.age --endpoint-url "$SCW_ENDPOINT"
      - name: Dechiffrement
        env:
          AGE_IDENTITY: ${{ secrets.AGE_IDENTITY }}
        run: pnpm exec tsx scripts/backup/age.ts decrypt /tmp/db.dump.age /tmp/db.dump
      - name: Supabase ephemere (schema des migrations)
        run: pnpm db:start
      - name: Restauration et controles
        run: scripts/backup/restore-data.sh /tmp/db.dump "postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres" 2>&1 | tee /tmp/restore.log
      - name: Rapport
        if: always()
        run: |
          {
            echo "## Test de restauration"
            echo "- Sauvegarde : \`${LATEST:-aucune}\`"
            echo "- Resultat : ${{ job.status }}"
            echo '```'
            grep -E 'NOTICE|ERROR|exception' /tmp/restore.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          shred -u /tmp/db.dump 2>/dev/null || true
