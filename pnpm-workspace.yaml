packages:
  - 'apps/*'
  - 'packages/*'

# unrs-resolver fournit des binaires precompiles : son script d'installation est inutile.
allowBuilds:
  unrs-resolver: false
  # La CLI Supabase telecharge son binaire a l'installation.
  supabase: true
  # esbuild (via tsx) utilise ses binaires optionnels par plateforme.
  esbuild: false

# Recommande pour React Native / Metro en monorepo pnpm (equivalent de
# node-linker=hoisted dans .npmrc, deplace ici depuis pnpm 10).
nodeLinker: hoisted

# Failles sans version corrigee, absentes du code execute en production (ADR-020) : a retirer des
# qu'un correctif est publie. node-forge : CLI Expo (outillage mobile) ; braces : CLI shadcn et ESLint.
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv
    - GHSA-vfj7-8cjw-p6xm
